name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: b2b
          POSTGRES_USER: glein
          POSTGRES_PASSWORD: 123456789
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U glein -d b2b"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, tokenizer, pdo_pgsql, pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Create Laravel test environment
        run: |
          cat > .env <<'ENV'
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=false
          APP_URL=http://localhost
          LOG_CHANNEL=stack

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=b2b
          DB_USERNAME=glein
          DB_PASSWORD=123456789

          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          MAIL_MAILER=array
          VITE_APP_NAME=Laravel
          ENV
          mkdir -p storage/framework/cache storage/framework/views bootstrap/cache
          chmod -R 777 storage bootstrap/cache
          php artisan key:generate
          php artisan config:clear

      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: b2b
          DB_USERNAME: glein
          DB_PASSWORD: 123456789
        run: php artisan migrate --force

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: b2b
          DB_USERNAME: glein
          DB_PASSWORD: 123456789
        run: php artisan test
