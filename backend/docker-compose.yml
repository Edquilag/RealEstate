version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real-estate-app
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: real-estate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: b2b
      POSTGRES_USER: glein
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
